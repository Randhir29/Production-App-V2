# Port of Config\Secure (agent.md §4.3). Duplicate keys are last-wins, as in PHP (D-12).
#
# `plants` (55 entries) was derived from the connection groups of the legacy Database.php:
# every Postgre group except `kosan` (legacy default), `testplant` and `jodhpur` (which §4.3
# says is absent from `plants`). Only the short_name keys are authoritative. The values are
# the slug in Title Case because Database.php carries no display names; replace them with the
# names from Config\Secure before relying on E01 `text`.
#
# `carousal_config` is NOT in Database.php and is still empty. It must be ported verbatim from
# Config\Secure (kota -> {1: heads 24, stdOutput 1800}, jammu -> {1: 24/1630}, jodhpur present).
# Until then every plant is treated as unconfigured by the scale-efficiency features (§5.5.2).
#
# No hosts or credentials belong in this file; they live in the central `plants` table.
